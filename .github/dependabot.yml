version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # gh-aw lockfiles are generated as a matched compiler/runtime set.
      - dependency-name: "github/gh-aw-actions/setup"
    commit-message:
      prefix: "ci"
      include: "scope"
